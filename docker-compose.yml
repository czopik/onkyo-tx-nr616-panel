services:
  onkyo-panel:
    build: .
    container_name: onkyo-panel
    network_mode: host          # panel + serwer mediów muszą być widoczne w LAN
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      ONKYO_CONFIG: /config/config.json
    volumes:
      - ./config:/config        # zapamiętany adres IP amplitunera
      - ./media:/media:ro       # pliki audio do castowania
    command:
      - "--host"
      - "192.168.1.34"          # <- IP Twojego amplitunera
      - "--media"
      - "/media"
      - "--ui-port"
      - "8770"
      - "--media-port"
      - "8765"
